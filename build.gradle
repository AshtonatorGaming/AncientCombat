plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args "-mixin.config=${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://www.cursemaven.com' }
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // HARD dependency
    implementation fg.deobf(files("libs/ancientwarfare-1.6.1.jar"))

    // OPTIONAL (compileOnly so the mod runs fine without them)
    compileOnly fg.deobf(files("libs/ancientcombat-1.0.0.jar"))
    compileOnly fg.deobf(files("libs/bettercombat-forge-1.9.0+1.20.1.jar"))
    compileOnly fg.deobf(files("libs/bettermobcombat-forge-1.20.1-1.3.0-all.jar"))
    compileOnly fg.deobf(files("libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar"))
    compileOnly fg.deobf(files("libs/bmcfix-forge-1.0.2.jar"))
    compileOnly fg.deobf(files("libs/entity_model_features-3.2.4-1.20.1-forge.jar"))
    compileOnly fg.deobf(files("libs/SpartanWeaponry-1.20.1-forge-3.2.1-all.jar"))
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : mod_authors,
            "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}